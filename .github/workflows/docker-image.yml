name: Docker Image

# 触发条件:
#   - tag 推送 (v*, 须在 main 上): 构建并推送 latest + 版本号 tag
#   - main 分支推送: 构建并推送 main tag (便于跟踪主分支最新构建)
#   - dev 分支推送: 构建并推送 beta tag (不会覆盖 latest)
#   - 手动触发: 用于调试
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推送到 ghcr.io 需要

jobs:
  build-push:
    name: Build & Push (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 用于校验 tag 是否在 main 上

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 需要在仓库 Settings -> Secrets 中配置:
      #   DOCKERHUB_USERNAME: Docker Hub 用户名
      #   DOCKERHUB_TOKEN   : Docker Hub PAT (Account Settings -> Personal access tokens, 勾选 Read & Write)
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 防止误在非 main 的提交上打 v* tag 从而覆盖 latest
      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # 自动生成 tag, 同时应用到 GHCR 和 Docker Hub 两个 registry:
      #   - main 分支       -> main
      #   - dev 分支        -> beta
      #   - v1.2.3 会同时打上4个tag      -> v1.2.3, 1.2.3, 1.2, latest
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/telegram-drive-bot
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/telegram-drive-bot
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
